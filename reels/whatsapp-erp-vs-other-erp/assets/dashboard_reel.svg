    <line x1="281" y1="72" x2="1600" y2="72" stroke="var(--line)"/>
    <rect x="312" y="14" width="520" height="44" rx="12" fill="#FFFFFF" stroke="var(--line)"/>
    <g fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"><circle cx="338" cy="35" r="7"/><path d="M343.500 40.500 L349 46"/></g>
