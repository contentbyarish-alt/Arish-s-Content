<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="db-title db-desc">
  <title id="db-title">Hivon ERP dashboard</title>
  <desc id="db-desc">Animated ERP management dashboard mockup with KPI cards, weekly presence chart and live alerts. Sample data only.</desc>

  <!--
    HIVON ERP DASHBOARD TEMPLATE  (1600 x 900)  - SAMPLE DATA ONLY
    ============================================================
    HOW TO EDIT (for scripts / Claude):
    1. KPI cards   -> groups id="kpi-*": edit title / number / caption text. Number colour = semantic (see palette).
    2. Bar chart   -> each bar is <rect class="grow" ...>. Value v (0-100): height = v*1.9, y = 830 - height.
                      Move the value label (id="bar-label-N") to y = barY + 28, and update polyline id="trend-line".
    3. Alerts      -> groups id="alert-*": edit text; badge colour: URGENT #DD524C, PENDING #E9A23B, DONE #55B685, NEW #101729.
    4. Portal name -> id="brand-name", user -> id="user-name".
    5. Timing      -> style attribute var "d" (start delay in seconds, e.g. d:1.2s) on animated groups (rise / grow / slide / draw).
    6. Still PNG   -> add class="static" on the root <svg>.
    Palette: hivon-colour-template skill (navy #101729, off-white #F9FAFC, greens #55B685 / #43946C, amber, coral, purple).
  -->

  <style>
    svg {
      --ink:#101729; --muted:#5B6475; --line:#E6E9F0; --canvas:#F9FAFC; --card:#FFFFFF; --mint:#EFFDF6;
      --green:#55B685; --deep:#43946C; --amber:#E9A23B; --coral:#DD524C; --purple:#845EEE;
      --font: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    text { font-family: var(--font); fill: var(--ink); }
    .h1 { font-size: 38px; font-weight: 800; }
    .sub { font-size: 17px; fill: var(--muted); }
    .card-title { font-size: 17px; font-weight: 600; fill: #3B4457; }
    .num { font-size: 54px; font-weight: 800; }
    .cap { font-size: 15px; fill: var(--muted); }
    .nav { font-size: 16px; font-weight: 500; }
    .sec { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; fill: #6B7280; }
    .axis { font-size: 12.5px; fill: var(--muted); }
    .badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; }
    .card { fill: var(--card); stroke: var(--line); }
    .soft { filter: drop-shadow(0 2px 6px rgba(16,23,41,.06)); }

    /* ---------- animation ---------- */
    .rise  { animation: rise .6s cubic-bezier(.2,.8,.2,1) var(--d,0s) both; }
    @keyframes rise { from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none} }
    .slide { animation: slide .55s cubic-bezier(.2,.8,.2,1) var(--d,0s) both; }
    @keyframes slide { from{opacity:0; transform:translateX(28px)} to{opacity:1; transform:none} }
    .grow  { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) both; }
    @keyframes grow { from{transform:scaleY(0)} to{transform:scaleY(1)} }
    .fade  { animation: fade .5s ease-out var(--d,0s) both; }
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .draw  { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-in-out var(--d,0s) forwards; }
    @keyframes draw { to{ stroke-dashoffset: 0 } }

    svg.static *, svg.static { animation: none !important; }
    svg.static .draw { stroke-dashoffset: 0; }
  </style>

  <rect width="1600" height="900" fill="var(--canvas)"/>


  <!-- ============ SIDEBAR ============ -->
  <g id="sidebar">
    <rect x="0" y="0" width="280" height="900" fill="#FFFFFF"/>
    <line x1="280" y1="0" x2="280" y2="900" stroke="var(--line)"/>
    <circle cx="46" cy="42" r="18" fill="#0D0D0D"/>
    <text x="46" y="48" text-anchor="middle" style="fill:#fff;font-size:15px;font-weight:800">HI</text>
    <text id="brand-name" x="74" y="49" style="font-size:22px;font-weight:700">Hivon ERP</text>
    <line x1="0" y1="82" x2="280" y2="82" stroke="var(--line)"/>
    <circle cx="48" cy="120" r="20" fill="#EEF0F4"/>
    <text x="48" y="126" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#6B7280">AU</text>
    <text id="user-name" x="82" y="116" style="font-size:18px;font-weight:600">Admin User</text>
    <text x="82" y="138" style="font-size:13.5px;fill:#6B7280;letter-spacing:.04em">ADMIN</text>
    <line x1="0" y1="164" x2="280" y2="164" stroke="var(--line)"/>

    <text class="sec" x="28" y="190">MAIN</text>
    <rect x="12" y="202" width="256" height="44" rx="10" fill="var(--mint)"/>
    <rect x="12" y="212" width="4" height="24" rx="2" fill="var(--green)"/>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="214" width="8" height="8" rx="1.5"/><rect x="41" y="214" width="8" height="8" rx="1.5"/><rect x="30" y="225" width="8" height="8" rx="1.5"/><rect x="41" y="225" width="8" height="8" rx="1.5"/></g>
    <text class="nav" x="64" y="230" style="font-weight:700">Dashboard</text>
    <text class="sec" x="28" y="276">PEOPLE</text>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="306" r="4.5"/><path d="M30 319 q8 -12 16 0"/></g>
    <text class="nav" x="64" y="316">Employee Management</text>
    <path d="M258 305 l5 5 l-5 5" fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sec" x="28" y="362">SALES &amp; LEADS</text>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="39" cy="395" r="9"/><circle cx="39" cy="395" r="4.5"/></g>
    <text class="nav" x="64" y="402">Leads Management</text>
    <path d="M258 391 l5 5 l-5 5" fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sec" x="28" y="448">INVENTORY</text>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M31 473 v17 h17"/><path d="M36 486 v-5 M41 486 v-9 M46 486 v-3"/></g>
    <text class="nav" x="64" y="488">Stock Dashboard</text>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M30 518 h3 l2 10 h11 l2 -7 h-14"/><circle cx="37" cy="533" r="1.5"/><circle cx="45" cy="533" r="1.5"/></g>
    <text class="nav" x="64" y="532">Procurement</text>
    <path d="M258 521 l5 5 l-5 5" fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sec" x="28" y="578">PRODUCTION</text>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M30 620 v-9 l6 4 v-4 l6 4 v-4 l6 4 v9 z"/><path d="M33 610 v-6 h3 v6"/></g>
    <text class="nav" x="64" y="618">Job Order &amp; Production</text>
    <path d="M258 607 l5 5 l-5 5" fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sec" x="28" y="664">FINANCE</text>
    <g fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="691" width="19" height="14" rx="3"/><path d="M30 696 h19"/><circle cx="44" cy="700" r="1" fill="#101729"/></g>
    <text class="nav" x="64" y="704">Finance</text>
    <path d="M258 693 l5 5 l-5 5" fill="none" stroke="#101729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="880" style="font-size:13px;fill:#6B7280">© 2026 Hivon · sample data</text>
  </g>


  <!-- ============ TOP BAR ============ -->
